services:
  db:
    image: ${DB_IMAGE_NAME} 
    container_name: ${DB_CONTAINER_NAME}
    build:
      context: ..
      dockerfile: ${DB_DOCKERFILE_PATH}
    restart: always
    ports:
      - "${DB_LOCAL_PORT}:${DB_SERVER_PORT}"
    networks:
      - MyNet
    environment:
      SERVER_ID: ${DB_SERVER_ID}
      SERVER_PORT: ${DB_SERVER_PORT}
      SERVER_DATA_DIR: ${DB_SERVER_DATA_DIR}
      LOCAL_DATA_DIR: ${DB_LOCAL_DATA_DIR}
      SERVER_LOG_PATH: ${DB_SERVER_LOG}
      LOCAL_LOG_PATH: ${DB_LOCAL_LOG_PATH}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      IP: ${DB_IP}
      NETWORK_NAME: ${NETWORK_NAME}
    volumes:
      - ${DB_LOCAL_DATA_DIR}:${DB_SERVER_DATA_DIR}
      - ${DB_LOCAL_LOG_PATH}:${DB_SERVER_LOG}
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u$DB_USER -p$DB_PASS -h 127.0.0.1 -P ${DB_SERVER_PORT:-3306} -e 'SELECT 1;'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  http:
    image: ${HTTP_IMAGE_NAME}
    container_name: ${HTTP_CONTAINER_NAME}
    build:
      context: ..
      dockerfile: ${HTTP_DOCKERFILE_PATH}
      args:
        - BUILD_HTTP_APK_REQ=${BUILD_HTTP_APK_REQ}
    restart: always
    ports:
      - "${HTTP_LOCAL_PORT}:${HTTP_SERVER_PORT}"
    networks:
      - MyNet
    environment:
      IMAGE_NAME: ${HTTP_IMAGE_NAME}
      CONTAINER_NAME: ${HTTP_CONTAINER_NAME}
      DOCKERFILE_PATH: ${HTTP_DOCKERFILE_PATH}
      SERVER_NAME: ${HTTP_NAME}
      SERVER_PORT: ${HTTP_SERVER_PORT}
      LOCAL_ROOT_PATH: ${HTTP_LOCAL_ROOT_PATH}
      SERVER_ROOT_PATH: ${HTTP_SERVER_ROOT_PATH}
      LOCAL_INFO_PATH: ${HTTP_LOCAL_INFO_PATH}
      SERVER_INFO_PATH: ${HTTP_SERVER_INFO_PATH}
      ALIAS_INFO_PATH: ${HTTP_ALIAS_INFO_PATH}
      LOCAL_LOG_PATH: ${HTTP_LOCAL_LOG_PATH}
      SERVER_LOG_PATH: ${HTTP_SERVER_LOG_PATH}
      IP: ${HTTP_IP}
      NETWORK_NAME: ${NETWORK_NAME}
      DB_HOST: ${DB_CONTAINER_NAME} 
      DB_PORT: ${DB_SERVER_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_NAME: ${APP_NAME}
      APP_GITHUB_URL: ${APP_GITHUB_URL}
      APP_LOCAL_PATH: ${APP_LOCAL_PATH}
      APP_COMPOSE_PATH: ${APP_COMPOSE_PATH}
      APP_ENTRYPOINT_LOCAL_PATH: ${APP_ENTRYPOINT_LOCAL_PATH}
      APP_ENTRYPOINT_SERVER_PATH: ${APP_ENTRYPOINT_SERVER_PATH}
      APP_ADMIN_USER: ${APP_ADMIN_USER}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
    volumes:
      - ${HTTP_LOCAL_ROOT_PATH}:${HTTP_SERVER_ROOT_PATH}
      - ${HTTP_LOCAL_INFO_PATH}:${HTTP_SERVER_INFO_PATH}
      - ${HTTP_LOCAL_LOG_PATH}:${HTTP_SERVER_LOG_PATH}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", 
        "curl", 
        "-f", 
        "http://${HTTP_NAME}/server-status"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  MyNet:
    name: ${NETWORK_NAME}
    driver: ${NETWORK_DRIVER}
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
          gateway: ${NETWORK_SUBNET_GATEWAY}
