Define SERVER_PORT 80
Define SERVER_NAME moodle.localhost
Define SERVER_ROOT_PATH /var/www/moodle

<VirtualHost *:${SERVER_PORT}>
    ServerName ${SERVER_NAME}
    ServerAdmin webmaster@${SERVER_NAME}

    DocumentRoot "${SERVER_ROOT_PATH}/public"

    <Directory "${SERVER_ROOT_PATH}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        AcceptPathInfo On

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L]
        </IfModule>

        FallbackResource /r.php

        <FilesMatch "^\.(htaccess|htpasswd|ini|git|env|lock)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory "${SERVER_ROOT_PATH}">
        Require all denied
    </Directory>

    DirectoryIndex index.php index.html

    ErrorLog /var/log/apache2/error_${SERVER_NAME}.log 
    CustomLog /var/log/apache2/access_${SERVER_NAME}.log combined
</VirtualHost>
