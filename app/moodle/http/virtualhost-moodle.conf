# Definir un VirtualHost que escucha en el puerto configurado
<VirtualHost *:${SERVER_PORT}>
    ServerName ${SERVER_NAME}
    ServerAdmin webmaster@${SERVER_NAME}

    # Directorio raíz público de la aplicación
    DocumentRoot "${SERVER_ROOT_PATH}/public"

    # Configuración del directorio público
    <Directory "${SERVER_ROOT_PATH}/public">
        Options -Indexes +FollowSymLinks
        
        # Permitir que Moodle gestione sus directivas vía .htaccess (Router / permalinks)
        AllowOverride All
        
        Require all granted

        # Reglas específicas de reescritura dentro del directorio público
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Mapeo estándar de solicitudes hacia el index.php si el archivo/directorio no existe
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L]
        </IfModule>

        # Bloquear únicamente archivos sensibles y de control de versiones
        <FilesMatch "^\.(htaccess|htpasswd|ini|git|env|lock)$">
            Require all denied
        </FilesMatch>
    </Directory>
        # Reglas de Reescritura Globales para Moodle y Proxy
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Evitar bucles de redirección (HTTP 502/500) tras Reverse Proxy (SSL Offloading)
        # Permite a Moodle detectar que la conexión original del cliente era HTTPS
        SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    </IfModule>

    # Restringir acceso al directorio privado base (dirroot)
    <Directory "${SERVER_ROOT_PATH}">
        Require all denied
    </Directory>

    # Prioridad estándar de archivos índice
    DirectoryIndex index.php index.html

    # Registros de log
    ErrorLog /var/log/apache2/error_${SERVER_NAME}.log 
    CustomLog /var/log/apache2/access_${SERVER_NAME}.log combined
</VirtualHost>
