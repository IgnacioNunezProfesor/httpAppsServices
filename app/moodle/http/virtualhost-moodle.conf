# Definir un VirtualHost que escucha en el puerto configurado
<VirtualHost *:${SERVER_PORT}>
    ServerName ${SERVER_NAME}
    ServerAdmin you@${SERVER_NAME}

    # Directorio raíz público de la aplicación
    DocumentRoot "${SERVER_ROOT_PATH}/public"

    # Configuración del directorio público
    <Directory "${SERVER_ROOT_PATH}/public">
        Options -Indexes +FollowSymLinks
        
        # Permitir que Moodle gestione sus directivas vía .htaccess
        AllowOverride All
        
        Require all granted

        # Bloquear únicamente archivos sensibles y de control de versiones
        <FilesMatch "^\.(htaccess|htpasswd|ini|git|env|lock)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Restringir acceso al directorio privado base (dirroot)
    <Directory "${SERVER_ROOT_PATH}">
        Require all denied
    </Directory>

    # Prioridad estándar de archivos índice
    DirectoryIndex index.php index.html

    # Registros de log
    ErrorLog /var/log/apache2/error_${SERVER_NAME}.log 
    CustomLog /var/log/apache2/access_${SERVER_NAME}.log combined
</VirtualHost>

