services:
  db:
    image: ${DB_IMAGE_NAME} 
    container_name: ${DB_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ${DB_DOCKERFILE_PATH}
    restart: always
    networks:
      - MyLAN
    environment:
      SERVER_ID: ${DB_SERVER_ID}
      SERVER_PORT: ${DB_SERVER_PORT}
      LOCAL_PORT: ${DB_LOCAL_PORT}
      SERVER_DATA_DIR: ${DB_SERVER_DATA_DIR}
      LOCAL_DATA_DIR: ${DB_LOCAL_DATA_DIR}
      SERVER_LOG_PATH: ${DB_SERVER_LOG}
      LOCAL_LOG_PATH: ${DB_LOCAL_LOG_PATH}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      IP: ${DB_IP}
      NETWORK_NAME: ${NETWORK_NAME}
    volumes:
      - ${DB_LOCAL_DATA_DIR}:${DB_SERVER_DATA_DIR}
      - ${DB_LOCAL_LOG_PATH}:${DB_SERVER_LOG}
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u$DB_USER -p$DB_PASS -h 127.0.0.1 -e 'SELECT 1;'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  http:
    image: ${HTTP_IMAGE_NAME}
    container_name: ${HTTP_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ${HTTP_DOCKERFILE_PATH}
    restart: always
    networks:
      - MyLAN
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    environment:
      WORDPRESS_DB_HOST: ${DB_CONTAINER_NAME} 
      WORDPRESS_DB_PORT: ${DB_SERVER_PORT}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      SERVER_NAME: ${HTTP_NAME}
      SERVER_PORT: ${HTTP_PORT}
      ALIAS_INFO_PATH: ${HTTP_ALIAS_INFO_PATH}  
      LOCAL_ROOT_PATH: ${HTTP_LOCAL_ROOT_PATH}
      SERVER_ROOT_PATH: ${HTTP_SERVER_ROOT_PATH}
      LOCAL_LOG_PATH: ${HTTP_LOCAL_LOG_PATH}
      SERVER_LOG_PATH: ${HTTP_SERVER_LOG_PATH}
      LOCAL_INFO_PATH: ${HTTP_LOCAL_INFO_PATH}
      SERVER_INFO_PATH: ${HTTP_SERVER_INFO_PATH}
      ALIAS_INFO_PATH: ${HTTP_ALIAS_INFO_PATH}
      IP: ${HTTP_IP}
      NETWORK_NAME: ${NETWORK_NAME}
      APP_NAME: ${APP_NAME}
      APP_WP_ADMIN_USER: ${APP_WP_ADMIN_USER}
      APP_WP_ADMIN_PASS: ${APP_WP_ADMIN_PASS}
      APP_WP_ADMIN_EMAIL: ${APP_WP_ADMIN_EMAIL}
      APP_ENTRYPOINT_PATH: ${APP_ENTRYPOINT_PATH}
    volumes:
      - ${HTTP_LOCAL_ROOT_PATH}:${HTTP_SERVER_ROOT_PATH}
      - ${HTTP_LOCAL_INFO_PATH}:${HTTP_SERVER_INFO_PATH}
      - ${HTTP_LOCAL_LOG_PATH}:${HTTP_SERVER_LOG_PATH}
    depends_on:
      db:
        condition: service_healthy
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://${HTTP_NAME}:${HTTP_PORT}/"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 40s
networks:
  MyLAN:
    name: ${NETWORK_NAME}
    driver: ${NETWORK_DRIVER}
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
          gateway: ${NETWORK_SUBNET_GATEWAY}