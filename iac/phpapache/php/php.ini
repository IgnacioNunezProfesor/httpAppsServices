[PHP]

; Output: Hide errors from HTTP response / terminal output (production best practice)
display_errors = On
display_startup_errors = On

; Logging: Enable full logging to file
log_errors = On
error_log = /var/log/apache2/php_error.log

; Level: Report ALL possible errors, warnings, notices, and deprecations
error_reporting = E_ALL

; Log Settings: Set to 0 to prevent cutting off long stack traces in the logs
log_errors_max_len = 0
ignore_repeated_errors = Off
ignore_repeated_source = Off
html_errors = Off

; Resource Limits
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 50

max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Sessions
session.save_handler = files
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 1
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.use_only_cookies = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Set validate_timestamps=1 and revalidate_freq=0 during debugging so changes log immediately
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

cli_server.color = On
